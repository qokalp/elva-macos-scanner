name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Xcode 26 (macOS 26 SDK) is required for the Tahoe look; see TECHNICAL.md §5.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test
      - name: Build app (universal, ad-hoc signed)
        run: scripts/build-app.sh
