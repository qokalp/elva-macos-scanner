name: Release

# Push a tag like v1.2.0 (or run manually) to build, sign, notarize and publish Elva-Scanner.dmg.
# The GitHub release is only created/updated when the signing secrets exist (MACOS_CERTIFICATE_P12,
# MACOS_CERTIFICATE_PASSWORD, NOTARY_KEY_P8, NOTARY_KEY_ID, NOTARY_ISSUER_ID); otherwise the
# ad-hoc signed DMG is only kept as a workflow artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.1). Defaults to the VERSION file.'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}";
          elif [[ -n "${{ inputs.version }}" ]]; then V="${{ inputs.version }}";
          else V="$(cat VERSION)"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "Releasing $V"

      - name: Import Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Notary API key
        if: env.HAS_NOTARY == 'true'
        env:
          KEY: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_ID=${{ secrets.NOTARY_KEY_ID }}" >> "$GITHUB_ENV"
          echo "NOTARY_ISSUER_ID=${{ secrets.NOTARY_ISSUER_ID }}" >> "$GITHUB_ENV"

      # Publish only signed builds. Without the signing secrets the DMG is kept as a workflow
      # artifact instead, so a notarized DMG uploaded from a Mac (scripts/release.sh --publish)
      # is never replaced by an unsigned one.
      - name: Build, sign, notarize and publish
        if: env.HAS_CERT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh --publish

      - name: Build (unsigned, not published)
        if: env.HAS_CERT != 'true'
        run: scripts/release.sh

      - name: Keep the DMG as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elva-Scanner-${{ env.VERSION }}
          path: |
            build/Elva-Scanner.dmg
            build/Elva-Scanner.dmg.sha256

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
